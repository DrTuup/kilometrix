[project]
name = "kilometrix"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ruben Claessens", email = "78033666+DrTuup@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.2",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "renault-api>=0.6.1",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kilometrix/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kilometrix"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
